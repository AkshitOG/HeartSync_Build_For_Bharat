[project]
name = "careergps"
version = "0.1.0"
description = "Deterministic Workforce & Career Decision Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "pypdf>=5.0.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "main:app"
